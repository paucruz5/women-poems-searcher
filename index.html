<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Write a word and the AI will search for a poem written by any woman in the world that contains that word/topic."
    />
    <meta name="keywords" content="poem, women, AI, search, poetry" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.7/dist/axios.min.js"></script>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courgette&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Akaya+Kanadaka&family=Courgette&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/style.css" />
    <title>Women Poems Searcher</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1 class="akaya-kanadaka-regular">
          WELCOME TO THE POEM SEARCHER
          <br />
          WRITTEN BY WOMEN
        </h1>
      </header>
      <main>
        <div id="form-container">
          <form id="poem-form">
            <input
              type="text"
              placeholder="Enter the topic of the poem witten by women"
              autofocus
              required
              autocomplete="off"
              class="instructions"
              id="user-instructions"
            />
            <input type="submit" class="button" />
          </form>
          <small class="small">i.e: sex, music or art</small>
        </div>
        <div class="textPoem courgette-regular" id="poem-text"></div>
      </main>
      <footer>
        This is an AI project; coded by
        <a
          href="https://paucruz.com/"
          target="_blank"
          rel="noopener noreferrer"
        >
          Paulina Cruz</a
        >; open-sourced on
        <a
          href="https://github.com/paucruz5/women-poems-searcher"
          target="_blank"
          rel="noopener noreferrer"
        >
          Github</a
        >; hosted on Netlify
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
